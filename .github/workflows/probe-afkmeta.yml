name: Probe AFK Meta Sorcerer

on:
  push:
    paths:
      - scripts/probe-afkmeta.mjs
      - .github/workflows/probe-afkmeta.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-afkmeta.mjs
