name: Sync AFK Meta talent data

on:
  push:
    paths:
      - scripts/probe-afkmeta.mjs
      - .github/workflows/probe-afkmeta.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-afkmeta.mjs
      - name: Commit current snapshot
        run: |
          git config user.name "deskrawl-data-bot"
          git config user.email "deskrawl-data-bot@users.noreply.github.com"
          git add src/data/afkmeta-talents.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: sync AFK Meta talent snapshot"
            git push origin HEAD:main
          fi
